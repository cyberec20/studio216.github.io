name: SEO and editorial validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install editorial build dependency
        run: pip install -r requirements-editorial.txt

      - name: Validate article metadata and publishing gates
        run: python scripts/build_articles.py --check

      - name: Rebuild article library
        run: python scripts/build_articles.py

      - name: Synchronize builder-authoritative editorial outputs
        run: |
          if ! git diff --quiet -- articles sitemap.xml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add articles sitemap.xml
            git commit -m "Regenerate AI said done outputs"
            git push origin HEAD:${{ github.head_ref }}
          fi

      - name: Validate builder source fidelity and sitemap contract
        run: python scripts/validate_builder_contract.py

      - name: Validate source SEO
        run: python scripts/validate_seo.py

      - name: Validate editorial foundation
        run: python scripts/validate_editorial.py

      - name: Build explicit public artifact
        run: python scripts/build_public_site.py --destination _site

      - name: Validate explicit publication boundary
        run: python scripts/validate_public_site.py --root _site --require-nojekyll

      - name: Validate global analytics and consent
        run: python scripts/validate_analytics.py --root _site

      - name: Validate explicit artifact SEO
        run: python scripts/validate_seo.py --root _site

      - name: Validate explicit artifact AI discoverability
        run: python scripts/validate_ai_discoverability.py --root _site

      - name: Upload explicit public artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: explicit-public-site
          path: _site/
          include-hidden-files: true
          retention-days: 1
