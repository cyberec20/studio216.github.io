name: SEO and editorial validation

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install editorial build dependency
        run: pip install -r requirements-editorial.txt

      - name: Validate article metadata and publishing gates
        run: python scripts/build_articles.py --check

      - name: Rebuild article library
        run: python scripts/build_articles.py

      - name: Verify all generated editorial outputs are committed
        run: git diff --exit-code -- articles sitemap.xml

      - name: Validate builder source fidelity and sitemap contract
        run: python scripts/validate_builder_contract.py

      - name: Validate source SEO
        run: python scripts/validate_seo.py

      - name: Validate editorial foundation
        run: python scripts/validate_editorial.py

      - name: Configure GitHub Pages metadata
        uses: actions/configure-pages@v5
        with:
          enablement: false

      - name: Build the actual GitHub Pages artifact
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site

      - name: Validate publication boundary
        run: python scripts/validate_public_site.py --root _site

      - name: Validate built-site SEO
        run: python scripts/validate_seo.py --root _site

      - name: Validate AI discoverability
        run: python scripts/validate_ai_discoverability.py --root _site

      - name: Build explicit public artifact
        run: python scripts/build_public_site.py --destination _public

      - name: Validate explicit publication boundary
        run: python scripts/validate_public_site.py --root _public

      - name: Validate explicit artifact SEO
        run: python scripts/validate_seo.py --root _public

      - name: Validate explicit artifact AI discoverability
        run: python scripts/validate_ai_discoverability.py --root _public

      - name: Upload explicit public artifact for inspection
        uses: actions/upload-artifact@v4
        with:
          name: explicit-public-site
          path: _public/
          include-hidden-files: true
          retention-days: 1
