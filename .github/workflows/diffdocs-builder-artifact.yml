name: Temporary DiffDocs builder commit

on:
  push:
    branches:
      - publish/diffdocs-rev2

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: publish/diffdocs-rev2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          pip install -r requirements-editorial.txt
          pip install pillow
      - name: Generate 120x68 DiffDocs reference assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          root = Path("assets/articles/diffdocs-zero-to-production")
          for lang in ("en", "es"):
              src = root / f"hero-{lang}.webp"
              out = root / f"reference-{lang}.webp"
              im = Image.open(src).convert("RGB")
              if im.size != (760, 428):
                  raise SystemExit(f"{src}: expected 760x428, found {im.size}")
              im.resize((120, 68), Image.Resampling.LANCZOS).save(out, "WEBP", quality=82, method=6)
          PY
      - name: Validate article metadata and publishing gates
        run: python scripts/build_articles.py --check
      - name: Rebuild deterministic article outputs
        run: python scripts/build_articles.py
      - name: Commit generated assets and outputs
        run: |
          git add assets/articles/diffdocs-zero-to-production/reference-*.webp articles sitemap.xml
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Generate DiffDocs article outputs"
          git push origin HEAD:publish/diffdocs-rev2
