<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
  <!-- Meta Pixel + Google Analytics (GA4) -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1210026194345632');fbq('track','PageView');
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9F4QMVWNPC"></script>
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
    gtag('js',new Date());gtag('config','G-9F4QMVWNPC');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="author" content="Franklin Rodriguez">
  <link rel="canonical" href="{{CANONICAL}}">
{{HREFLANG_LINKS}}
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="{{OG_IMAGE}}">
  <meta property="article:published_time" content="{{PUBLISHED}}">
  <meta property="article:modified_time" content="{{MODIFIED}}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{OG_TITLE}}">
  <meta name="twitter:description" content="{{META_DESCRIPTION}}">
  <meta name="twitter:image" content="{{OG_IMAGE}}">
  <script type="application/ld+json">{{JSON_LD}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/editorial.css">
</head>
<body class="min-h-screen">
  <header class="p-6 border-b border-gray-900 sticky top-0 z-50 backdrop-blur-md bg-black/70">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/" aria-label="Studios 216 Home"><img src="/assets/studio_logo.jpeg" alt="Studios 216 Logo" class="h-12 w-auto rounded-md"></a>
      <nav class="flex items-center gap-5 text-sm">
        <a href="/about.html" class="text-gray-400 hover:text-white">About</a>
        <a href="/articles/" class="text-white">Articles</a>
      </nav>
    </div>
  </header>

  <main class="editorial-shell py-12">
    <div class="editorial-grid">
      <aside class="author-rail">
        <div class="author-rail-card">
          <p class="text-xs uppercase tracking-[.18em] text-gray-500 mb-3">Written by</p>
          <h2 class="text-lg font-bold text-white">Franklin Rodriguez</h2>
          <p class="text-sm text-gray-400 mt-1">Founder &amp; CEO · Engineer · Author · Instructor</p>
          <div class="mt-5 space-y-2 text-sm">
            <a class="block" href="/about/founder/">About Franklin</a>
            <a class="block" href="/articles/">Articles</a>
            {{AUTHOR_EXTRA_LINKS}}
          </div>
        </div>
      </aside>

      <article>
        <div class="mb-8">
          {{LANGUAGE_SWITCH}}
          <p class="mt-5 text-xs uppercase tracking-[.18em] text-blue-400">{{TOPICS}}</p>
          <h1 class="text-4xl sm:text-5xl font-black text-white leading-tight mt-3">{{ARTICLE_TITLE}}</h1>
          <p class="text-lg text-gray-400 mt-5">{{META_DESCRIPTION}}</p>
          <p class="text-sm text-gray-500 mt-5">{{DATE_LINE}} · {{READING_TIME}}</p>
        </div>
        <div class="article-body">{{ARTICLE_BODY}}</div>
      </article>
    </div>
  </main>
</body>
</html>
