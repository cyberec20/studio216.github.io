<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
  <!-- Meta Pixel + Google Analytics (GA4) -->
  <script>
    !function(f,b,e,v,n,t,s){if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};if(!f._fbq)f._fbq=n;
    n.push=n;n.loaded=!0;n.version='2.0';n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];s.parentNode.insertBefore(t,s)}
    (window,document,'script','https://connect.facebook.net/en_US/fbevents.js');
    fbq('init','1210026194345632');fbq('track','PageView');
  </script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-9F4QMVWNPC"></script>
  <script>
    window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
    gtag('js',new Date());gtag('config','G-9F4QMVWNPC');
  </script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  {{HREFLANG_LINKS}}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="https://studios216.com/assets/logo.jpg">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/editorial.css">
</head>
<body class="min-h-screen">
  <header class="p-6 border-b border-gray-900">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/"><img src="/assets/studio_logo.jpeg" alt="Studios 216 Logo" class="h-12 w-auto rounded-md"></a>
      <nav class="flex gap-5 text-sm"><a href="/about.html" class="text-gray-400 hover:text-white">About</a><a href="/blog/" class="text-gray-400 hover:text-white">Legacy Blog</a></nav>
    </div>
  </header>
  <main class="editorial-shell py-14">
    <div class="max-w-3xl">
      <p class="text-xs uppercase tracking-[.18em] text-blue-400">Studios216 Articles</p>
      <h1 class="text-4xl sm:text-5xl font-black text-white mt-3">{{HEADING}}</h1>
      <p class="text-lg text-gray-400 mt-5">{{INTRO}}</p>
      {{LANGUAGE_NAV}}
    </div>
    <div id="article-list" class="article-list mt-10"></div>
    <p id="empty-state" class="text-gray-500 mt-10 hidden">{{EMPTY_STATE}}</p>
  </main>
  <script>
    const language = "{{FILTER_LANG}}";
    fetch("/articles/posts.json")
      .then(r => r.json())
      .then(posts => {
        const selected = language ? posts.filter(p => p.lang === language) : posts;
        const list = document.getElementById("article-list");
        const empty = document.getElementById("empty-state");
        if (!selected.length) { empty.classList.remove("hidden"); return; }
        selected.forEach(post => {
          const a = document.createElement("a");
          a.href = post.url;
          a.className = "article-list-card";
          a.innerHTML = `<p class="text-xs uppercase tracking-wider text-blue-400">${post.lang.toUpperCase()} · ${post.date}</p><h2 class="text-xl font-bold text-white mt-2">${post.title}</h2><p class="text-gray-400 mt-2">${post.description}</p>`;
          list.appendChild(a);
        });
      });
  </script>
</body>
</html>
