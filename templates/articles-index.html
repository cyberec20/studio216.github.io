<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{PAGE_TITLE}}</title>
  <meta name="description" content="{{META_DESCRIPTION}}">
  <meta name="robots" content="{{ROBOTS}}">
  <link rel="canonical" href="{{CANONICAL}}">
  {{HREFLANG_LINKS}}
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{PAGE_TITLE}}">
  <meta property="og:description" content="{{META_DESCRIPTION}}">
  <meta property="og:url" content="{{CANONICAL}}">
  <meta property="og:image" content="https://studios216.com/assets/logo.jpg">
  <meta property="og:site_name" content="Studios 216">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{PAGE_TITLE}}">
  <meta name="twitter:description" content="{{META_DESCRIPTION}}">
  <meta name="twitter:image" content="https://studios216.com/assets/logo.jpg">
  <script type="application/ld+json">{{JSON_LD}}</script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/editorial.css">
  <link rel="stylesheet" href="/assets/css/institutional-brand.css">
</head>
<body class="min-h-screen">
  <header class="p-6 border-b border-gray-900 sticky top-0 z-50 backdrop-blur-md bg-black/70">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <a href="/" class="studio-brand-lockup"><img src="/assets/studio_logo.jpeg" alt="Studios 216 Logo" class="h-12 w-auto rounded-md">
        <span class="studio-brand-wordmark" aria-hidden="true">STUDIOS<span class="studio-brand-wordmark__number">216</span></span></a>
      <nav class="flex gap-5 text-sm"><a href="/products/" class="text-gray-400 hover:text-white">Products</a><a href="/about.html" class="text-gray-400 hover:text-white">About</a><a href="/articles/" class="text-white">Articles</a></nav>
    </div>
  </header>
  <main class="editorial-shell py-14">
    <div class="max-w-3xl">
      <p class="text-xs uppercase tracking-[.18em] text-blue-400">Studios216 Articles</p>
      <h1 class="text-4xl sm:text-5xl font-black text-white mt-3">{{HEADING}}</h1>
      <p class="text-lg text-gray-400 mt-5">{{INTRO}}</p>
    </div>
    <section class="article-toolbar mt-9" aria-label="Article filters">
      <input id="article-search" class="article-search" type="search" placeholder="{{SEARCH_PLACEHOLDER}}" autocomplete="off">
      <select id="topic-filter" class="topic-select topic-select-native" aria-label="{{ALL_TOPICS_LABEL}}">{{TOPIC_OPTIONS}}</select>
      <div id="topic-picker" class="topic-picker">
        <button id="topic-picker-button" class="topic-picker-button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="topic-picker-menu">
          <span id="topic-picker-label">{{ALL_TOPICS_LABEL}}</span>
          <span class="topic-picker-chevron" aria-hidden="true">⌄</span>
        </button>
        <div id="topic-picker-menu" class="topic-picker-menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      {{LANGUAGE_FILTERS}}
    </section>
    <div class="article-results-meta mt-5">
      <p id="article-results-summary" class="text-sm text-gray-400" aria-live="polite"></p>
    </div>
    <div id="article-list" class="article-list mt-5">{{ARTICLE_CARDS}}</div>
    <p id="empty-state" class="text-gray-500 mt-10 hidden">{{EMPTY_STATE}}</p>
    <nav id="article-pagination" class="article-pagination mt-7 hidden" aria-label="Article pages">
      <button id="page-prev" class="article-page-button" type="button"></button>
      <span id="page-status" class="article-page-status" aria-live="polite"></span>
      <button id="page-next" class="article-page-button" type="button"></button>
    </nav>
  </main>
  <script>
    const fixedLanguage={{FILTER_LANG_JSON}};
    let activeLanguage=fixedLanguage;
    let currentPage=1;
    const PAGE_SIZE=10;
    const search=document.getElementById("article-search");
    const topic=document.getElementById("topic-filter");
    const topicPicker=document.getElementById("topic-picker");
    const topicButton=document.getElementById("topic-picker-button");
    const topicMenu=document.getElementById("topic-picker-menu");
    const topicLabel=document.getElementById("topic-picker-label");
    const allTopicsLabel={{ALL_TOPICS_LABEL_JSON}};
    let activeTopic="";
    const list=document.getElementById("article-list");
    const empty=document.getElementById("empty-state");
    const summary=document.getElementById("article-results-summary");
    const pagination=document.getElementById("article-pagination");
    const prev=document.getElementById("page-prev");
    const next=document.getElementById("page-next");
    const pageStatus=document.getElementById("page-status");
    const cards=[...list.querySelectorAll(".article-list-card")];

    const normalize=value => (value||"").toLocaleLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");
    const cardTopics=card => (card.dataset.topics||"").split("||").filter(Boolean);
    const labels=()=>{
      const lang=(activeLanguage==="es"||fixedLanguage==="es")?"es":"en";
      return lang==="es"
        ? {previous:"Anterior",next:"Siguiente",page:"Página",of:"de",showing:"Mostrando",results:"resultados",total:"en total"}
        : {previous:"Previous",next:"Next",page:"Page",of:"of",showing:"Showing",results:"results",total:"total"};
    };
    function closeTopicMenu({focusButton=false}={}){
      topicMenu.hidden=true;
      topicButton.setAttribute("aria-expanded","false");
      if(focusButton) topicButton.focus();
    }
    function syncTopicControls(){
      topic.value=activeTopic;
      topicLabel.textContent=activeTopic||allTopicsLabel;
      topicMenu.querySelectorAll(".topic-picker-option").forEach(option=>{
        const selected=option.dataset.value===activeTopic;
        option.setAttribute("aria-selected",selected?"true":"false");
        option.classList.toggle("selected",selected);
      });
    }
    function selectTopic(value){
      activeTopic=value;
      syncTopicControls();
      closeTopicMenu();
      resetAndRender();
    }
    function rebuildTopics(){
      const topicValues=[...new Set(cards
        .filter(card=>!activeLanguage||card.dataset.lang===activeLanguage)
        .flatMap(card=>cardTopics(card)))].sort((a,b)=>a.localeCompare(b));

      if(activeTopic&&!topicValues.includes(activeTopic)) activeTopic="";

      topic.replaceChildren();
      const nativeAll=document.createElement("option");
      nativeAll.value="";
      nativeAll.textContent=allTopicsLabel;
      topic.appendChild(nativeAll);
      topicValues.forEach(value=>{
        const opt=document.createElement("option");
        opt.value=value;
        opt.textContent=value;
        topic.appendChild(opt);
      });

      topicMenu.replaceChildren();
      [["",allTopicsLabel],...topicValues.map(value=>[value,value])].forEach(([value,label])=>{
        const option=document.createElement("button");
        option.type="button";
        option.className="topic-picker-option";
        option.dataset.value=value;
        option.setAttribute("role","option");
        option.textContent=label;
        option.addEventListener("click",()=>selectTopic(value));
        topicMenu.appendChild(option);
      });
      syncTopicControls();
    }
    function matchingCards(){
      const q=normalize(search.value);
      const t=activeTopic;
      return cards.filter(card=>{
        const languageOK=!activeLanguage||card.dataset.lang===activeLanguage;
        const topicOK=!t||cardTopics(card).includes(t);
        const searchOK=!q||normalize(card.textContent).includes(q);
        return languageOK&&topicOK&&searchOK;
      });
    }
    function render(){
      const matches=matchingCards();
      const totalMatches=matches.length;
      const totalPages=Math.max(1,Math.ceil(totalMatches/PAGE_SIZE));
      currentPage=Math.min(currentPage,totalPages);
      const start=(currentPage-1)*PAGE_SIZE;
      const end=Math.min(start+PAGE_SIZE,totalMatches);
      const visibleSet=new Set(matches.slice(start,end));
      cards.forEach(card=>card.classList.toggle("hidden",!visibleSet.has(card)));

      empty.classList.toggle("hidden",totalMatches>0);
      const copy=labels();
      if(totalMatches===0){
        summary.textContent=`0 ${copy.results} · ${cards.length} ${copy.total}`;
      }else{
        const range=totalMatches===1?"1":`${start+1}–${end}`;
        const filteredSuffix=totalMatches===cards.length?"":` · ${cards.length} ${copy.total}`;
        summary.textContent=`${copy.showing} ${range} ${copy.of} ${totalMatches} ${copy.results}${filteredSuffix}`;
      }

      prev.textContent=copy.previous;
      next.textContent=copy.next;
      pageStatus.textContent=`${copy.page} ${currentPage} ${copy.of} ${totalPages}`;
      prev.disabled=currentPage<=1;
      next.disabled=currentPage>=totalPages;
      pagination.classList.toggle("hidden",totalPages<=1);
    }
    function resetAndRender(){ currentPage=1; render(); }
    function goToPage(delta){
      currentPage+=delta;
      render();
      list.scrollIntoView({behavior:"smooth",block:"start"});
    }
    document.querySelectorAll("[data-lang]").forEach(btn=>btn.addEventListener("click",()=>{
      activeLanguage=btn.dataset.lang;
      document.querySelectorAll("[data-lang]").forEach(b=>b.classList.toggle("active",b===btn));
      rebuildTopics(); resetAndRender();
    }));
    search.addEventListener("input",resetAndRender);
    topic.addEventListener("change",()=>{
      activeTopic=topic.value;
      syncTopicControls();
      resetAndRender();
    });
    topicButton.addEventListener("click",()=>{
      const opening=topicMenu.hidden;
      topicMenu.hidden=!opening;
      topicButton.setAttribute("aria-expanded",opening?"true":"false");
      if(opening){
        const selected=topicMenu.querySelector('.topic-picker-option[aria-selected="true"]')||topicMenu.querySelector(".topic-picker-option");
        selected?.focus();
      }
    });
    topicButton.addEventListener("keydown",event=>{
      if(["ArrowDown","Enter"," "].includes(event.key)){
        event.preventDefault();
        topicMenu.hidden=false;
        topicButton.setAttribute("aria-expanded","true");
        const selected=topicMenu.querySelector('.topic-picker-option[aria-selected="true"]')||topicMenu.querySelector(".topic-picker-option");
        selected?.focus();
      }
    });
    topicMenu.addEventListener("keydown",event=>{
      const options=[...topicMenu.querySelectorAll(".topic-picker-option")];
      const index=options.indexOf(document.activeElement);
      if(event.key==="Escape"){
        event.preventDefault();
        closeTopicMenu({focusButton:true});
      }else if(event.key==="ArrowDown"){
        event.preventDefault();
        options[(index+1+options.length)%options.length]?.focus();
      }else if(event.key==="ArrowUp"){
        event.preventDefault();
        options[(index-1+options.length)%options.length]?.focus();
      }else if(event.key==="Home"){
        event.preventDefault();
        options[0]?.focus();
      }else if(event.key==="End"){
        event.preventDefault();
        options.at(-1)?.focus();
      }
    });
    document.addEventListener("click",event=>{
      if(!topicPicker.contains(event.target)) closeTopicMenu();
    });
    prev.addEventListener("click",()=>goToPage(-1));
    next.addEventListener("click",()=>goToPage(1));
    rebuildTopics(); render();
  </script>
</body>
</html>
